<style>
/* Layout: a full-bleed airport map with floating glass controls, the tower's flight panel docked at the bottom (left on wide screens). */
:root {
  --map: #eef1ec; --corridor: #e2e8f2; --stairs: #95a1b2; --grass: #d4e9cb; --wood: #c2ddb7; --water: #b3d3f3; --apron-pave: #e5e7eb; --taxi: #dadde3; --taxi-line: #e6c14a; --runway: #c6cad2; --runway-mark: #ffffff; --road-case: #d3d8de; --road-fill: #ffffff; --mway-case: #e8c574; --mway-fill: #fdeab4; --rail: #aeb6c0; --lot: #e8eaee; --other-bldg: #dfe2e7; --term-closed: #ebecef; --bldg: #ffffff; --bldg-edge: #bfc8d4; --road: #d6dce3; --walk: #d3d9e0; --bldg-shadow: rgba(30, 45, 80, .2); --plane: #c9d0d9; --bridge: #c3ccd6; --garage: #dde1e7; --con-tint: .13;
  --hall-up: #dcf1eb; --hall-up-edge: #86c6b4; --hall-up-text: #2f8a74; --hall-lo: #fbefd8; --hall-lo-edge: #e2ba6c; --hall-lo-text: #a8761c; --curb: #eceef2; --zebra: #ffffff; --glass: #8fb6e6; --counter: #5d6b85; --carousel: #d5dbe6; --carousel-belt: #7d8799; --door: #2f50d0;
  --glass: rgba(250, 250, 252, .96); --sheet-bg: #f7f7fa; --glass-hi: rgba(255, 255, 255, .55); --hairline: rgba(60, 60, 67, .16);
  --card: rgba(255, 255, 255, .92); --solid: #fbfbfd; --fill: rgba(118, 118, 128, .12); --fill-2: rgba(118, 118, 128, .2);
  --label: #101318; --label-2: rgba(60, 60, 67, .64); --label-3: rgba(60, 60, 67, .34);
  --shadow: 0 10px 30px rgba(16, 24, 40, .14), 0 1px 3px rgba(16, 24, 40, .08);
  --primary: #2f50d0; --on-primary: #ffffff; --primary-c: #dee3ff; --on-primary-c: #0c1a66;
  --brand: #2f50d0; --on-brand: #ffffff;
  --route: #2f50d0; --route-case: #ffffff;
  --conA: #64798a; --conB: #2563d8; --conC: #7a4cd6;
  --ac-air: #2f50d0; --ac-ground: #5d6b85; --ac-dep: #d9480f; --ac-need: #2f50d0; --ac-shadow: rgba(20, 30, 50, .18); --ok: #1d8a4a; --warn: #b86e00; --no: #d33a32;
  --font-display: "Roboto Flex", "Google Sans", Roboto, system-ui, sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Roboto Flex", Roboto, "Segoe UI", sans-serif;
  --spring: cubic-bezier(.2, 1.35, .35, 1);
  --spring-slow: cubic-bezier(.25, 1.15, .4, 1);
  --safe-top: var(--sat, env(safe-area-inset-top, 0px));
  --safe-bottom: var(--sab, env(safe-area-inset-bottom, 0px));
  --safe-left: var(--sal, env(safe-area-inset-left, 0px));
  --safe-right: var(--sar, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
@supports (transition-timing-function: linear(0, 1)) {
  :root {
    --spring: linear(0, .013 1%, .053 2.1%, .212 4.6%, .742 11.6%, .95 15%, 1.054 18.6%, 1.104 22.3%, 1.112 24.6%, 1.1 27.4%, 1.034 34.6%, .998 41.2%, .989 46.9%, .996 59.5%, 1.001 72.5%, 1);
    --spring-slow: linear(0, .009 1.4%, .037 2.9%, .146 6%, .53 14.1%, .793 20.5%, .953 26.9%, 1.033 33.3%, 1.059 38.9%, 1.054 44.6%, 1.012 58.3%, .997 72%, 1);
  }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --map: #111513; --corridor: #3d4656; --stairs: #7a8696; --grass: #172519; --wood: #1a2b1d; --water: #12263b; --apron-pave: #181b20; --taxi: #20242a; --taxi-line: #8a7323; --runway: #2a2f37; --runway-mark: #575e69; --road-case: #22272e; --road-fill: #2d333b; --mway-case: #4d4024; --mway-fill: #5e5030; --rail: #3f4650; --lot: #1b1f24; --other-bldg: #22262d; --term-closed: #1e2228; --bldg: #2f3540; --bldg-edge: #4a5262; --road: #2a3038; --walk: #3a424d; --bldg-shadow: rgba(0, 0, 0, .55); --plane: #2c333d; --bridge: #434c59; --garage: #1c2026; --con-tint: .2; --hall-up: #1d3833; --hall-up-edge: #3b7768; --hall-up-text: #79c2ae; --hall-lo: #3a3021; --hall-lo-edge: #7d6535; --hall-lo-text: #d4a656; --curb: #2a2f37; --zebra: #8e97a5; --glass: #4f74a8; --counter: #9aa7c0; --carousel: #3a4458; --carousel-belt: #8d97ab; --door: #7d97ff;
    --glass: rgba(34, 34, 38, .95); --sheet-bg: #1d1d21; --glass-hi: rgba(255, 255, 255, .07); --hairline: rgba(84, 84, 88, .55);
    --card: rgba(44, 44, 48, .88); --solid: #242428; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .34);
    --label: #f3f4f8; --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
    --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
    --primary: #a9b8ff; --on-primary: #0f1f6e; --primary-c: #24358c; --on-primary-c: #e0e5ff;
    --brand: #3c5ee6; --on-brand: #ffffff;
    --route: #5b7cff; --route-case: #0c0f13;
    --conA: #93a6b4; --conB: #5f97f2; --conC: #a989ee;
    --ac-air: #7f99ff; --ac-ground: #aab4c4; --ac-dep: #ff8a4c; --ac-need: #3c5ee6; --ac-shadow: rgba(0, 0, 0, .4); --ok: #4fd07a; --warn: #c98a1a; --no: #ff6b63;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --map: #111513; --corridor: #3d4656; --stairs: #7a8696; --grass: #172519; --wood: #1a2b1d; --water: #12263b; --apron-pave: #181b20; --taxi: #20242a; --taxi-line: #8a7323; --runway: #2a2f37; --runway-mark: #575e69; --road-case: #22272e; --road-fill: #2d333b; --mway-case: #4d4024; --mway-fill: #5e5030; --rail: #3f4650; --lot: #1b1f24; --other-bldg: #22262d; --term-closed: #1e2228; --bldg: #2f3540; --bldg-edge: #4a5262; --road: #2a3038; --walk: #3a424d; --bldg-shadow: rgba(0, 0, 0, .55); --plane: #2c333d; --bridge: #434c59; --garage: #1c2026; --con-tint: .2; --hall-up: #1d3833; --hall-up-edge: #3b7768; --hall-up-text: #79c2ae; --hall-lo: #3a3021; --hall-lo-edge: #7d6535; --hall-lo-text: #d4a656; --curb: #2a2f37; --zebra: #8e97a5; --glass: #4f74a8; --counter: #9aa7c0; --carousel: #3a4458; --carousel-belt: #8d97ab; --door: #7d97ff;
  --glass: rgba(34, 34, 38, .95); --sheet-bg: #1d1d21; --glass-hi: rgba(255, 255, 255, .07); --hairline: rgba(84, 84, 88, .55);
  --card: rgba(44, 44, 48, .88); --solid: #242428; --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .34);
  --label: #f3f4f8; --label-2: rgba(235, 235, 245, .62); --label-3: rgba(235, 235, 245, .3);
  --shadow: 0 10px 30px rgba(0, 0, 0, .5), 0 1px 3px rgba(0, 0, 0, .4);
  --primary: #a9b8ff; --on-primary: #0f1f6e; --primary-c: #24358c; --on-primary-c: #e0e5ff;
  --brand: #3c5ee6; --on-brand: #ffffff;
    --route: #5b7cff; --route-case: #0c0f13;
  --conA: #93a6b4; --conB: #5f97f2; --conC: #a989ee;
  --ac-air: #7f99ff; --ac-ground: #aab4c4; --ac-dep: #ff8a4c; --ac-need: #3c5ee6; --ac-shadow: rgba(0, 0, 0, .4); --ok: #4fd07a; --warn: #c98a1a; --no: #ff6b63;
  color-scheme: dark;
}


* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: var(--map); color: var(--label);
  font: 16px/1.35 var(--font-text); letter-spacing: -.01em; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; letter-spacing: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.glass { background: var(--glass); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-hi); border: .5px solid var(--hairline); }

/* ---------- Map ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }
#base, #baseFade, svg#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#baseFade { pointer-events: none; opacity: 0; }
#baseFade.out { animation: floor-fade .32s ease-out both; }
@keyframes floor-fade { from { opacity: 1; } to { opacity: 0; } }
#map.floor-in .mk { animation: mk-in .35s ease-out both; }
@keyframes mk-in { from { opacity: 0; } }
svg#map { overflow: visible; transform-origin: 0 0; will-change: transform; touch-action: none; }
#map .zs { transform-origin: 0 0; scale: var(--zs, 1); rotate: var(--zr, 0deg); }
#map .zs-s { transform-origin: 0 0; scale: var(--zs, 1); }
.apron { fill: none; pointer-events: all; }
#map text { text-rendering: geometricPrecision; }
.area-lbl[data-off] { display: none; }
.map-lbl { font: 650 8.5px var(--font-display); fill: var(--label-2); letter-spacing: .08em; text-transform: uppercase; }
.con-letter { font: 800 14px var(--font-display); font-variation-settings: "wdth" 110; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.mk { cursor: pointer; transition: opacity .3s ease; }
.mk .pop { transition: transform .45s var(--spring); transform-box: fill-box; transform-origin: center; }
@media (hover: hover) { #map .mk:hover .pop { transform: scale(1.3); } }
/* gate numbers: a pill in the concourse colour; pills that would overlap shrink to dots until you zoom in */
.gate .pill { stroke: var(--bldg); stroke-width: 1; }
.gate .drop { fill: rgba(20, 30, 50, .22); }
.gate text { font: 700 6.6px var(--font-display); font-variation-settings: "wdth" 85; fill: #fff; text-anchor: middle; dominant-baseline: central; pointer-events: none; transition: opacity .2s; }
.gate[data-dot] .pop { transform: scale(.42); }
.gate[data-dot] text { opacity: 0; }
.gate[data-dot] .pill { x: -5.5px; width: 11px; }
.gate[data-dot="hide"] { opacity: 0 !important; pointer-events: none; }
/* choosing a gate: free ones light up, taken ones step back */
#map.pick .gate.busy { opacity: .28; }
#map.pick .gate.free .pill { stroke: var(--route); stroke-width: 2; }
#map.pick .gate.free .pop { animation: gate-pulse 1.2s ease-in-out infinite; }
@keyframes gate-pulse { 50% { transform: scale(1.25); } }

/* ---------- Aircraft ---------- */
.ac { cursor: pointer; }
.ac .fuse { fill: var(--ac-ground); stroke: var(--bldg); stroke-width: .7; stroke-linejoin: round; }
.ac.dep .fuse { fill: var(--ac-dep); }
.ac.air .fuse { fill: var(--ac-air); }
.ac .shadow { fill: var(--ac-shadow); display: none; }
.ac.air .shadow { display: block; }
.ac .hit { fill: transparent; }
.ac .halo { fill: none; stroke: none; }
.ac.need .halo { fill: color-mix(in srgb, var(--ac-need) 22%, transparent); }
.ac.sel .halo { fill: color-mix(in srgb, var(--route) 22%, transparent); stroke: var(--route); stroke-width: 1.2; }
.ac.warn .fuse { fill: var(--no); animation: warn 1s ease-in-out infinite; }
@keyframes warn { 50% { opacity: .45; } }
.tag { cursor: pointer; }
.tag rect { fill: var(--solid); stroke: var(--hairline); stroke-width: .5; }
.tag text { font: 700 5.4px var(--font-display); fill: var(--label); dominant-baseline: central; }
.tag .st { font: 600 4.2px var(--font-text); fill: var(--label-2); }
.tag.need rect { fill: var(--ac-need); stroke: none; }
.tag.need text { fill: #fff; }
.tag.warn rect { fill: var(--no); }
.tag.sel rect { stroke: var(--route); stroke-width: 1.2; }
.sel-route { fill: none; stroke: var(--route); stroke-width: 3.5; stroke-dasharray: 1 7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.rw-lbl { pointer-events: none; }
.rw-lbl rect { fill: #2b3340; }
.rw-lbl text { font: 800 7px var(--font-display); font-variation-settings: "wdth" 90; fill: #fff; text-anchor: middle; dominant-baseline: central; }

/* ---------- Tower: score bar, flight panel, start screen ---------- */
.topbar { display: flex; flex-direction: column; align-items: flex-start; }
.hud { display: inline-flex; align-items: center; gap: 12px; height: 40px; padding: 0 6px 0 14px; border-radius: 20px; margin-top: 8px; font: 650 14px var(--font-text); white-space: nowrap; }
.hud b { font: 800 16px var(--font-display); font-variation-settings: "wdth" 110; font-variant-numeric: tabular-nums; }
.hud .k { color: var(--label-2); font-weight: 600; font-size: 12px; margin-right: 4px; }
.hud button { width: 32px; height: 32px; border: 0; border-radius: 16px; background: var(--fill); display: grid; place-items: center; font: 800 13px var(--font-display); }
.hud button .ico { width: 16px; height: 16px; }
.strikes { display: inline-flex; gap: 4px; }
.strikes i { width: 10px; height: 10px; border-radius: 50%; background: var(--fill-2); }
.strikes i.on { background: var(--no); }
.dock { position: fixed; z-index: 5; left: calc(var(--safe-left) + 12px); right: calc(var(--safe-right) + 12px); bottom: calc(var(--safe-bottom) + 12px);
  border-radius: 24px; padding: 8px; display: flex; flex-direction: column; gap: 8px; max-height: 46vh; }
.cmd { background: var(--solid); border-radius: 18px; padding: 12px; flex: none; }
.cmd-head { display: flex; align-items: center; gap: 10px; }
.cmd-head .grow { flex: 1; min-width: 0; }
.cmd-head b { display: block; font: 800 18px var(--font-display); font-variation-settings: "wdth" 105; }
.cmd-head .st { display: block; font-size: 13px; color: var(--label-2); }
.iconbtn { width: 32px; height: 32px; border: 0; border-radius: 16px; background: var(--fill); font-size: 20px; line-height: 1; color: var(--label-2); flex: none; }
.chip { width: 12px; height: 12px; border-radius: 4px; flex: none; background: var(--ac-ground); }
.chip.dep { background: var(--ac-dep); } .chip.air { background: var(--ac-air); }
.fuel { height: 6px; border-radius: 3px; background: var(--fill); margin-top: 10px; overflow: hidden; }
.fuel i { display: block; height: 100%; background: var(--ok); border-radius: 3px; transition: width .3s; }
.fuel i.low { background: var(--no); }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.act { min-height: 40px; padding: 6px 14px; border: 0; border-radius: 20px; background: var(--brand); color: var(--on-brand); font: 750 15px var(--font-display); font-variation-settings: "wdth" 105;
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; transition: transform .3s var(--spring), border-radius .35s var(--spring); }
.act:active { transform: scale(.94); border-radius: 12px; }
.act small { font: 600 11px var(--font-text); opacity: .9; }
.act.busy, .act.traffic { background: var(--warn); }
.hint { margin: 10px 2px 0; font-size: 13px; color: var(--label-2); }
.strips { display: flex; flex-direction: column; gap: 2px; overflow: auto; min-height: 0; }
.strip { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; width: 100%; min-height: 40px; padding: 0 12px; border: 0; border-radius: 14px; background: none; text-align: left; flex: none; }
.strip:hover { background: var(--fill); }
.strip.sel { background: var(--fill-2); }
.strip b { font: 750 15px var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .what { font-size: 13px; color: var(--label-2); white-space: nowrap; }
.strip em { font: 750 13px var(--font-display); font-style: normal; min-width: 36px; text-align: right; color: var(--label-2); font-variant-numeric: tabular-nums; }
.strip em.low { color: var(--no); }
.calm { margin: 8px 12px; font-size: 13px; color: var(--label-2); }
@media (min-width: 760px) {
  .dock { right: auto; width: 380px; top: calc(var(--safe-top) + 120px); max-height: none; }
  .strips { flex: 1; }
  .scalebar, .attrib { left: calc(var(--safe-left) + 404px); }
}
@media (max-width: 759px) { .dock .strips { max-height: 128px; } }
.overlay { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--map) 55%, transparent); }
.overlay .card { width: min(440px, 100%); max-height: calc(100vh - 32px); overflow: auto; border-radius: 28px; padding: 24px; background: var(--solid); box-shadow: var(--shadow); animation: pop-in .42s var(--spring) both; }
.overlay .eyebrow { margin: 0; font-size: 13px; font-weight: 650; color: var(--label-2); }
.overlay h1 { margin: 4px 0 8px; font: 800 30px/1.05 var(--font-display); font-variation-settings: "wdth" 112, "opsz" 40; }
.overlay p, .overlay li { font-size: 15px; margin: 8px 0; }
.overlay ol { padding-left: 20px; margin: 10px 0; display: grid; gap: 2px; }
.overlay .s { color: var(--label-2); font-size: 14px; }
.big { width: 100%; height: 52px; margin-top: 12px; border: 0; border-radius: 26px; background: var(--brand); color: var(--on-brand); font: 800 18px var(--font-display); font-variation-settings: "wdth" 110;
  transition: transform .35s var(--spring), border-radius .4s var(--spring); }
.big:active { transform: scale(.97); border-radius: 16px; }
body.paused #stage { filter: saturate(.35); }

/* ---------- Airport name (tap to switch airport) ---------- */
.topbar { position: fixed; z-index: 5; top: calc(var(--safe-top) + 12px); left: calc(var(--safe-left) + 16px); right: calc(var(--safe-right) + 76px); pointer-events: none; }
.topbar > * { pointer-events: auto; }
.ap-btn { display: inline-flex; max-width: 100%; height: 44px; align-items: center; gap: 10px; padding: 0 16px 0 6px; border-radius: 22px; font-weight: 650; }
.ap-btn .ap-code { flex: none; padding: 4px 10px; border-radius: 16px; background: var(--brand); color: var(--on-brand); font: 800 14px var(--font-display); font-variation-settings: "wdth" 110; }
.ap-btn .ap-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ap-btn::after { flex: none; content: "⌄"; font-weight: 800; color: var(--label-2); margin-top: -6px; }
.ap-btn:active { transform: scale(.97); }
.ap-menu { position: absolute; top: 52px; left: 0; width: min(340px, calc(100vw - 32px)); border-radius: 20px; padding: 6px 0; background: var(--solid); transform-origin: 40px 0; }
.ap-menu button { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; padding: 10px 16px; border: 0; background: none; text-align: left; }
.ap-menu button:hover, .ap-menu button:focus-visible { background: var(--fill); }
.ap-menu .code { font: 800 17px var(--font-display); font-variation-settings: "wdth" 110; color: var(--primary); }
.ap-menu .s { display: block; font-size: 13px; color: var(--label-2); }

/* ---------- Popovers ---------- */
.layers, .ap-menu { animation: pop-in .42s var(--spring) both; }
.leaving { animation: pop-out .16s ease-in both !important; pointer-events: none; }
@keyframes pop-in { from { opacity: 0; transform: scale(.9) translateY(-6px); } }
@keyframes pop-out { to { opacity: 0; transform: scale(.96) translateY(-4px); } }
.layers button, .ap-menu button { animation: row-in .38s var(--spring-slow) both; animation-delay: calc(var(--n, 0) * 22ms); }
@keyframes row-in { from { opacity: 0; transform: translateY(-5px); } }
.layers { position: fixed; z-index: 6; right: calc(var(--safe-right) + 72px); width: min(270px, calc(100% - 104px)); border-radius: 20px; padding: 6px 0; background: var(--solid); transform-origin: calc(100% + 30px) 22px; }
.layers .lh { padding: 8px 16px 4px; font-size: 13px; font-weight: 600; color: var(--label-2); }
.layers button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 16px; border: 0; background: none; text-align: left; font-weight: 600; }
.layers button:hover { background: var(--fill); }
.con-menu { max-height: 70vh; overflow: auto; }
.con-menu button .badge { width: 26px; height: 26px; }
.con-menu button .s { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--label-2); }
.badge text { font: 800 11px var(--font-display); fill: #fff; text-anchor: middle; dominant-baseline: central; }
#conBtn .ico { width: 22px; height: 22px; }
@media (pointer: coarse) { .fine-only { display: none !important; } }

/* ---------- Floors ---------- */
.floor { position: relative; }
.floor::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 44px; background: var(--brand);
  transform: translateY(calc(var(--i, 0) * 100%)); transition: transform .45s var(--spring); }
